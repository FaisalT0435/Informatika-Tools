about:
  content: >-
    # Acerca de las herramientas de información

    Este maravilloso sitio web, hecho con μ por [Faisal Tri Surya
    Atmaja](https://portolio.faisalproject.com) , agrega herramientas útiles
    para desarrollador y personas que trabajan en TI. Si lo encuentras útil, por
    favor no dudes en compartirlo con la gente que crees que puede encontrarlo
    útil también y no olvides marcarlo en tu barra de acceso directo!

    Informatika Tools es de código abierto (bajo la licencia GPL-3.0) y libre, y
    siempre lo será, pero me cuesta dinero para albergar y renovar el nombre de
    dominio. Si quieres apoyar mi trabajo, y animarme a añadir más herramientas.

    ## Technologies

    Informatika Tools se realiza en Vue.js (Vue 3) con la biblioteca de
    componentes Naive UI y es hospedada y continuamente desplegada por Vercel.
    Las bibliotecas de código abierto de terceros se utilizan en algunas
    herramientas, puede encontrar la lista completa en el archivo
    [package.json](https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json)
    del repositorio.

    ## ¿Encontraste un bicho? ¿Una herramienta falta?

    Si necesita una herramienta que actualmente no está presente aquí, y cree
    que puede ser útil, le invitamos a presentar una solicitud de
    características en la [sección de
    datos](https://github.com/FaisalT0435/Informatika-Tools/issues) en el
    repositorio GitHub.

    Y si encontró un error, o algo no funciona como se esperaba, por favor
    presente un informe de error en la [sección de los
    resultados](https://github.com/FaisalT0435/Informatika-Tools/issues) en el
    repositorio GitHub.

    .
