    description: >-
      Computes a hash-based message autation code (HMAC) using a secret key and
      your favorite hashing function.
  bip39-generator:
    title: BIP39 generador de contraseña
    description: >-
      Generar una contraseña BIP39 de una mnemónica existente o aleatoria, o
      obtener la mnemónica de la contraseña.
