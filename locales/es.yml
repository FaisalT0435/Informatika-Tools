    description: >-
      Encrypt clear text and decrypt ciphertext using crypto algoritmos like
      AES, TripleDES, Rabbit or RC4.
  random-port-generator:
    title: Generador de puerto aleatorio
    description: >-
      Generar números de puerto aleatorios fuera de la gama de puertos
      "conocidos" (0-1023).
  yaml-prettify:
    title: Prettificación y formato de YAML
    description: Prettifica tu cadena YAML en un formato amistoso y legible por humanos.
