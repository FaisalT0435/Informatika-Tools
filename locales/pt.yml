    description: >-
      Um Identificador Universalmente Único (UUID) é um número de 128 bits usado
      para identificar informações em sistemas de computador. O número de
      possíveis UIIDs é de 16^32, que é 2^128 ou cerca de 3,4x10^38 (que é
      muito!).
