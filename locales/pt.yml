    description: >-
      Compare facilmente o tempo de execução de tarefas com este construtor de
      benchmark online muito simples.
  git-memo:
    title: Git batotasheet
    description: >-
      Git é um software de gerenciamento de versão descentralizada. Com esta
      planilha, você terá acesso rápido aos comandos git mais comuns.
  slugify-string:
    title: Slugify string
    description: Faça um URL string, nome do arquivo e id seguro.
  encryption:
    title: Criptografar/descriptografar texto
    description: >-
      Criptografar texto limpo e descriptografar texto cifrado usando algoritmos
      criptográficos como AES, TripleDES, Rabbit ou RC4.
  random-port-generator:
    title: Gerador aleatório de portas
    description: >-
      Gerar números aleatórios de portas fora do intervalo de portas
      "conhecidas" (0-1023).
  yaml-prettify:
    title: Pretificar e formatar o YAML
    description: Pretifique sua string YAML em um formato amigável e legível por humanos.
  eta-calculator:
    title: Calculadora ETA
    description: >-
      Uma calculadora ETA (Estimated Time of Arrival) para determinar o tempo
      final aproximado de uma tarefa, por exemplo, o tempo final e a duração de
      um download de arquivo.
  roman-numeral-converter:
