about:
  content: >-
    # # Sobre informatika-tools

    Este website maravilhoso, feito com □ por [Faisal Tri Surya
    Atmaja](https://portolio.faisalproject.com), agrega ferramentas úteis para o
    desenvolvedor e as pessoas que trabalham em TI. Se você achar útil, por
    favor sinta-se livre para compartilhá-lo para pessoas que você acha que pode
    encontrá-lo útil também e não se esqueça de bookmarká-lo em sua barra de
    atalho!

    Informatika Tools é open-source (sob a licença GPL-3.0) e gratuito, e sempre
    será, mas me custa dinheiro para hospedar e renovar o nome do domínio. Se
    você quiser apoiar meu trabalho, e me encorajar a adicionar mais
    ferramentas.

    # # Tecnologias

    A Informatika Tools é feita em Vue.js (Vue 3) com a biblioteca de
    componentes de UI naive e é hospedada e continuamente implantada pela
    Vercel. Bibliotecas de código aberto de terceiros são usadas em algumas
    ferramentas, você pode encontrar a lista completa no arquivo
    [package.json](https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json)
    do repositório.

    ## Encontraste um insecto? Falta uma ferramenta?

    Se você precisar de uma ferramenta que não esteja presente aqui, e você acha
    que pode ser útil, você é bem-vindo para enviar uma solicitação de recurso
    na seção [edições](https://github.com/FaisalT0435/Informatika-Tools/issues)
    no repositório GitHub.

    E se você encontrou um bug, ou algo não funciona como esperado, por favor
    arquive um relatório de bug na seção
    [edições](https://github.com/FaisalT0435/Informatika-Tools/issues) no
    repositório GitHub.

    .
