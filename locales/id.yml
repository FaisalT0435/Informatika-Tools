about:
  content: >-
    # Tentang informasi-alat

    Website yang indah ini, dibuat oleh Faisal Tri Surya Atmaja] (https: / /
    portolio.faisalproject.com), mengumpulkan alat-alat yang berguna untuk
    pengembang dan orang-orang yang bekerja di IT. Jika Anda merasa berguna,
    silakan bagikan pada orang yang Anda pikir mungkin berguna juga dan jangan
    lupa untuk membookmark itu di batang pintas Anda!

    Informatika Tools adalah open source (di bawah lisensi GPL-3.0) dan gratis,
    dan akan selalu begitu, tetapi saya menghabiskan uang untuk menjadi tuan
    rumah dan memperbaharui nama domain. Jika Anda ingin mendukung pekerjaan
    saya, dan mendorong saya untuk menambahkan lebih banyak alat.

    # # Technologies

    Perkakas Informatika dibuat dalam Vue.js (Vue 3) dengan pustaka komponen
    Naive UI dan ditempatkan terus menerus oleh Vercel. Tiga partai membuka
    pustaka sumber yang digunakan dalam beberapa alat, Anda mungkin menemukan
    daftar lengkap dalam berkas [package.json] (https: / / github.com /
    FaisalT0435 / Infformatika- Perkakas / pohon / defig / package.json) dari
    repositori.

    # Menemukan bug? Alat yang hilang?

    Jika Anda memerlukan alat yang saat ini tidak ada di sini, dan Anda berpikir
    dapat berguna, Anda dipersilakan untuk mengajukan permintaan fitur dalam
    bagian [isu] (https: / / github.com / FaisalT0435 / Informati- Perkakas /
    isu) di repositori GitHub.

    Dan jika Anda menemukan bug, atau sesuatu tidak bekerja seperti yang
    diharapkan, silakan berkas laporan bug dalam bagian [isu] (https: / /
    github.com / FaisalT0435 / Informatika-Perkakas / isu) dalam repositori
    GitHub.

    .
