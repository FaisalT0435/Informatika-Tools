    description: >-
      Convertir un nombre entre différentes bases (décimal, hexadécimal,
      binaire, octal, base64, ...)
  yaml-to-json-converter:
    title: Convertisseur YAML vers JSON
    description: >-
      Il suffit de convertir YAML en JSON avec ce convertisseur en direct en
      ligne.
  uuid-generator:
