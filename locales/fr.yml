      Calculez facilement les pourcentages d'une valeur à une autre, ou d'un
      pourcentage à une valeur.
  svg-placeholder-generator:
    title: Générateur de localisateur SVG
    description: >-
      Générer des images svg à utiliser comme support de place dans vos
      applications.
  json-to-csv:
    title: JSON à CSV
    description: Convertir JSON en CSV avec détection automatique d'en-tête.
  camera-recorder:
    title: Enregistreur de caméras
    description: Prenez une photo ou enregistrez une vidéo de votre webcam ou caméra.
  keycode-info:
    title: Informations sur le code clé
    description: >-
      Trouvez le code clé javascript, le code, l'emplacement et les
      modificateurs de n'importe quelle clé pressée.
  emoji-picker:
    title: Picker Emoji
    description: >-
      Copiez et collez les emojis facilement et obtenez la valeur unicode et les
      points de code de chaque emoji.
  color-converter:
    title: Convertisseur de couleur
    description: Convertir la couleur entre les différents formats (hex, rgb, hsl et css)
  bcrypt:
    title: Chiffre
    description: >-
      Hash et comparer la chaîne de texte en utilisant bcrypt. Bcrypt est une
      fonction de hachage de mots de passe basée sur le chiffre Blowfish.
  crontab-generator:
    title: Générateur de crontab
    description: >-
      Valider et générer le crontab et obtenir la description lisible par
      l'homme du calendrier de cron.
  http-status-codes:
    title: Codes d'état HTTP
    description: La liste de tous les codes d'état HTTP, leur nom et leur signification.
  sql-prettify:
    title: Prétifier et formater SQL
    description: >-
      Formater et prettifier vos requêtes SQL en ligne (il prend en charge
      différents dialectes SQL).
  benchmark-builder:
    title: Constructeur de repères
    description: >-
      Comparer facilement le temps d'exécution des tâches avec ce constructeur
      de référence en ligne très simple.
  git-memo:
    title: Feuille de triche Git
    description: >-
      Git est un logiciel de gestion de version décentralisé. Avec cette feuille
      de triche, vous aurez rapidement accès aux commandes git les plus
      courantes.
  slugify-string:
    title: Chaîne de slugify
    description: Faites une URL à chaîne, un nom de fichier et un id sécurisé.
  encryption:
    title: Chiffrer / déchiffrer le texte
    description: >-
      Chiffrer le texte clair et le chiffrer en utilisant des algorithmes
      cryptographiques comme AES, TripleDES, Rabbit ou RC4.
  random-port-generator:
    title: Générateur de port aléatoire
    description: >-
      Générer des numéros de port aléatoires en dehors de la plage des ports «
      connus » (0-1023).
  yaml-prettify:
    title: YAML prettify et format
    description: Prettifiez votre chaîne YAML dans un format amical et lisible par l'homme.
  eta-calculator:
    title: Calculatrice ETA
    description: >-
      Calculateur ETA (heure d'arrivée prévue) pour déterminer l'heure de fin
      approximative d'une tâche, par exemple, l'heure de fin et la durée du
      téléchargement d'un fichier.
  roman-numeral-converter:
    title: Convertisseur de chiffres romains
    description: >-
      Convertir des chiffres romains en chiffres et convertir des chiffres en
      chiffres romains.
  hmac-generator:
    title: Générateur Hmac
    description: >-
      Calcule un code d'authentification de message basé sur le hachage (HMAC)
      en utilisant une clé secrète et votre fonction de hachage préférée.
  bip39-generator:
    title: Générateur de mots de passe BIP39
    description: >-
      Générer une phrase de passe BIP39 à partir d'une mnémonique existante ou
      aléatoire, ou obtenir la mnémonique à partir de la phrase de passe.
  base64-file-converter:
    title: Convertisseur de fichiers Base64
    description: >-
      Convertissez une chaîne, un fichier ou une image en sa représentation de
      base64.
  list-converter:
    title: Convertisseur de liste
    description: >-
      Cet outil peut traiter des données basées sur des colonnes et appliquer
      diverses modifications (transposer, ajouter préfixe et suffixe, liste
      inversée, trier la liste, valeurs minuscules, valeurs tronquées) à chaque
      ligne.
  base64-string-converter:
    title: Encodeur/décodeur de chaîne Base64
    description: >-
      Il suffit d'encoder et de décoder les chaînes dans leur représentation de
      base64.
  toml-to-yaml:
    title: TOML à YAML
    description: Parse et convertir TOML en YAML.
  math-evaluator:
    title: Évaluateur en mathématiques
    description: >-
      Calculatrice pour l'évaluation des expressions mathématiques. Vous pouvez
      utiliser des fonctions comme squrt, cos, péché, abdos, etc.
  json-to-yaml-converter:
    title: Convertisseur JSON à YAML
    description: >-
      Il suffit de convertir JSON en YAML avec ce convertisseur en direct en
      ligne.
  url-parser:
    title: Analyseur d'URL
    description: >-
      Parcourez une URL dans ses différentes parties constituantes (protocole,
      origine, params, port, nom d'utilisateur-mot de passe,...)
  iban-validator-and-parser:
    title: Validateur et analyseur IBAN
    description: >-
      Valider et analyser les numéros IBAN. Vérifiez si un IBAN est valide et
      obtenez le pays, BBAN, si c'est un QR-IBAN et le format ami IBAN.
  user-agent-parser:
    title: Analyseur utilisateur-agent
    description: >-
      Détecter et analyser le navigateur, le moteur, le système d'exploitation,
      le processeur et le type/modèle de périphérique à partir d'une chaîne
      utilisateur-agent.
  numeronym-generator:
    title: Générateur de numéronymes
    description: >-
      Un numéronyme est un mot où un nombre est utilisé pour former une
      abréviation. Par exemple, "i18n" est un chiffre de "internationalisation"
      où 18 représente le nombre de lettres entre le premier i et le dernier n
      du mot.
  case-converter:
