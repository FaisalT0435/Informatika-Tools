about:
  content: >-
    ♪ À propos des outils informatika

    Ce merveilleux site web, réalisé avec l'aide de [Faisal Tri Surya Atmaja]
    (https://portolio.faisalproject.com) , regroupe des outils utiles pour les
    développeurs et les personnes travaillant dans l'informatique. Si vous le
    trouvez utile, s'il vous plaît n'hésitez pas à le partager à des personnes
    que vous pensez peut le trouver utile aussi et n'oubliez pas de le marquer
    dans votre barre de raccourci!

    Informatika Tools est open-source (sous licence GPL-3.0) et gratuit, et le
    sera toujours, mais cela me coûte de l'argent pour accueillir et renouveler
    le nom de domaine. Si vous voulez soutenir mon travail, et m'encourager à
    ajouter plus d'outils.

    Technologies

    Informatika Tools est réalisé dans Vue.js (Vue 3) avec la bibliothèque de
    composants de l'interface utilisateur Naive et est hébergé et déployé en
    permanence par Vercel. Les bibliothèques tiers open-source sont utilisées
    dans certains outils, vous pouvez trouver la liste complète dans le fichier
    [package.json](https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json)
    du dépôt.

    Oui. Tu as trouvé un bug ? Il manque un outil ?

    Si vous avez besoin d'un outil qui n'est actuellement pas présent ici, et
    que vous pensez qu'il peut être utile, vous pouvez soumettre une demande de
    fonctionnalités dans la section
    [issues](https://github.com/FaisalT0435/Informatika-Tools/issues) dans le
    dépôt GitHub.

    Et si vous avez trouvé un bug, ou quelque chose ne fonctionne pas comme
    prévu, veuillez déposer un rapport de bug dans la section
    [issues](https://github.com/FaisalT0435/Informatika-Tools/issues) dans le
    dépôt GitHub.

    .
