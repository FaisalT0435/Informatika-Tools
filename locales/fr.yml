    description: >-
      Un identifiant universel unique (UUID) est un numéro de 128 bits utilisé
      pour identifier l'information dans les systèmes informatiques. Le nombre
      d'UUID possibles est de 16^32, soit 2^128 ou environ 3,4x10^38 (ce qui est
      beaucoup!).
