about:
  content: >-
    # Über informatika-tools

    Diese wunderbare Website, die von [Faisal Tri Surya
    Atmaja](https://portolio.faisalproject.com) erstellt wurde, aggregiert
    nützliche Tools für Entwickler und Mitarbeiter in der IT. Wenn Sie es
    nützlich finden, fühlen Sie sich frei, es an Menschen zu teilen, die Sie
    denken, kann es nützlich zu finden, und vergessen Sie nicht, es in Ihrer
    Shortcut-Bar zu sehen!

    Informatika Tools ist Open-Source (unter der GPL-3.0 Lizenz) und kostenlos
    und wird immer sein, aber es kostet mich Geld, um den Domainnamen zu hosten
    und zu erneuern. Wenn Sie meine Arbeit unterstützen wollen und mich dazu
    ermutigen, mehr Werkzeuge hinzuzufügen.

    Technologien

    Informatika Tools wird in Vue.js (Vue 3) mit der Naive
    UI-Komponenten-Bibliothek gemacht und wird von Vercel gehostet und
    kontinuierlich eingesetzt. Open-Source-Bibliotheken von Drittanbietern
    werden in einigen Tools verwendet, können Sie die vollständige Liste in der
    [package.json](https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json)-Datei
    des Repository finden.

    oder Einen Fehler gefunden? Ein Werkzeug fehlt?

    Wenn Sie ein Tool benötigen, das derzeit nicht vorhanden ist, und Sie
    denken, dass nützlich sein kann, sind Sie herzlich eingeladen, eine
    Feature-Anfrage im
    [Ausgaben-Abschnitt](https://github.com/FaisalT0435/Informatika-Tools/issues)
    im GitHub-Repository einzureichen.

    Und wenn Sie einen Fehler gefunden haben oder etwas nicht wie erwartet
    funktioniert, geben Sie bitte einen Fehlerbericht im
    [Ausgaben-Abschnitt](https://github.com/FaisalT0435/Informatika-Tools/issues)
    im GitHub-Repository ein.

    .
