about:
  content: >-
    # عن أجهزة الإعلام

    ويجمع هذا الموقع الشبكي الرائع، الذي أُعدّ بصيغة (Faisal Tri Surya Atmaja)
    (https://portolio.faisalproject.com)، أدوات مفيدة للمطور وللأشخاص العاملين
    في مجال تكنولوجيا المعلومات. إذا وجدته مفيداً، رجاءً إشعر بالحرية لتشاركه
    للناس الذين تعتقد أنه قد يجده مفيداً أيضاً ولا تنسى أن تحجزه في حانتك
    القصيرة

    وتُعد أدوات " Informatika Tools " مفتوحة المصدر (بموجب رخصة GPL-3.0)
    ومجانية، وستكون كذلك دائماً، ولكنها تكلّفني المال لاستضافة وتجديد اسم
    النطاق. إذا كنت تريد دعم عملي، وتشجعني على إضافة المزيد من الأدوات.

    التكنولوجيات

    Informatika Tools is made in Vue.js (Vue 3) with the Naive UI component
    library and is hosted and continuously deployed by Vercel. وتستخدم مكتبات
    المصادر المفتوحة للحزب الثالث في بعض الأدوات، ويمكنكم أن تجدوا القائمة
    الكاملة في ملف المستودع (التعبئة.json)
    (https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json).

    # وجدت حشرة؟ أداة مفقودة؟

    وإذا كنت بحاجة إلى أداة غير موجودة حالياً هنا، وأظن أنه يمكن أن يكون مفيداً،
    فإنكم ترحبون بتقديم طلب خاص في [القسم المتعلق بالقضايا]
    (https://github.com/FaisalT0435/Informatika-Tools/issues) في مستودع غيت هوب.

    وإذا وجدت حشرة، أو شيء ما لا يعمل كما هو متوقع، يرجى تقديم تقرير حشرة في
    [قسم القضايا] (https://github.com/FaisalT0435/Informatika-Tools/issues) في
    مستودع GitHub.

    .
