about:
  content: >-
    Нема Про інформатика-інструменти

    Цей чудовий веб-сайт, виготовлений з ❤ [Faisal Tri Surya
    Atmaja](https://portolio.faisalproject.com) , агрегати корисні інструменти
    для розробника та людей, які працюють в ІТ. Якщо ви знайдете це корисно,
    будь ласка, зв'яжіться з ним, щоб поділитися ним людьми, які ви думаєте,
    можуть знайти його корисними і не забудьте зауважити, що у вашому ярлику
    Бар!

    Інформатика Інструменти є відкритим вихідним кодом (для ліцензії GPL-3.0) і
    безкоштовно, і завжди буде, але це коштує гроші для розміщення і оновлення
    доменного імені. Якщо ви хочете підтримувати свою роботу, і заохочуйте мене
    додавати більше інструментів.

    Технології

    У Vue.js (Vue 3) з бібліотекою компонента Naive UI і постійно розгортається
    Vercel. У деяких інструментах ви можете знайти повний список в
    [package.json](https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json)
    файл репозиторій.

    Українська Знайдено помилки? Інструмент відсутній?

    Якщо вам потрібен інструмент, який в даний час не присутній тут, і ви
    думаєте, може бути корисним, ви можете подати запит на функцію в розділі
    [викладки](https://github.com/FaisalT0435/Informatika-Tools/issues) в
    репозиторію GitHub.

    І якщо ви знайшли помилку, або щось не працює, як очікується, будь ласка,
    поставте звіт про помилки в розділі
    [видання](https://github.com/FaisalT0435/Informatika-Tools/issues) в
    репозиторію GitHub.

    .
