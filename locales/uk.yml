    title: Текст до алфавіту НАТО
    description: Трансформувати текст в телефонний алфавіт НАТО для усної передачі.
  basic-auth-generator:
    title: Базовий генератор
    description: Генерувати базовий заголовок auth від імені користувача та пароля.
  text-to-unicode:
    title: Текст до Unicode
    description: Парсе і перетворення тексту в unicode і навпаки
  ipv4-range-expander:
    title: Розширювач діапазону IPv4
    description: >-
      З огляду на початок та кінцеву IPv4 адресу, цей інструмент розраховує
      дійсну IPv4 субмережу разом з його позначенням CIDR.
  text-diff:
    title: Текстовий дифузор
    description: Порівняти два тексти і побачити відмінності між ними.
  otp-generator:
    title: Генератор коду OTP
    description: >-
      Для отримання багатофакторної автентифікації генеруйте та встановіть
      часовий пароль.
  url-encoder:
    title: Код/decode URL-форматовані рядки
    description: >-
      Увімкніть текст у формат URL-кодування (також відомий як
      "перецентний-кодований"), або декодування з нього.
  text-to-binary:
    title: Текст до ASCII бінарний
    description: Конвертувати текст до свого бінарного представництва ASCII та сповіщувача.
