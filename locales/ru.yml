about:
  content: >-
    # О информатике-инструментах

    Этот замечательный веб-сайт, созданный с помощью [Faisal Tri Surya Atmaja]
    (https://portolio.faisalproject.com), объединяет полезные инструменты для
    разработчиков и людей, работающих в ИТ. Если вы находите его полезным,
    пожалуйста, не стесняйтесь делиться им с людьми, которые, по вашему мнению,
    могут найти его полезным, и не забудьте добавить его в закладки в вашем
    ярлыке!

    Informatika Tools является открытым исходным кодом (под лицензией GPL-3.0) и
    бесплатным, и всегда будет, но это стоит мне денег, чтобы разместить и
    обновить доменное имя. Если вы хотите поддержать мою работу и побудить меня
    добавить больше инструментов.

    ## Технологии

    Informatika Tools производится в Vue.js (Vue 3) с библиотекой компонентов
    Naive UI и размещается и постоянно развертывается Vercel. В некоторых
    инструментах используются сторонние библиотеки с открытым исходным кодом,
    полный список которых можно найти в файле репозитория [package.json]
    (https://github.com/FaisalT0435/Informatika-Tools/tree/develop/package.json).

    ### Нашёл жучок? Инструмент отсутствует?

    Если вам нужен инструмент, которого в настоящее время здесь нет, и вы
    считаете, что он может быть полезен, вы можете отправить запрос на функцию в
    репозитории GitHub
    (https://github.com/FaisalT0435/Informatika-Tools/issues).

    И если вы обнаружили ошибку, или что-то не работает, как ожидалось,
    пожалуйста, подайте отчет об ошибке в [раздел выпусков]
    (https://github.com/FaisalT0435/Informatika-Tools/issues) в репозитории
    GitHub.

    .
